name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Lint PHP syntax
        run: |
          php -l backend/public/index.php
          php -l backend/src/postsClass.php
          php -l backend/src/schedulingClass.php
          php -l backend/src/signupClass.php

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build API image
        run: docker build -t fitmarket-api -f Dockerfile .

      - name: Build production frontend image
        run: docker build -t fitmarket-frontend -f frontend/Dockerfile.prod frontend
